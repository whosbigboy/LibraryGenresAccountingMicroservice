version: '3.8'

services:
  library-genres-service:
    build: .
    container_name: library-genres-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/genres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

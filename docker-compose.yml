services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10
  genres:
    build: ./lab4/library_genres_registration
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/library
      SPRING_DATASOURCE_USERNAME: library
      SPRING_DATASOURCE_PASSWORD: library
    depends_on:
      database: {condition: service_healthy}
  books:
    build: ./lab5/book_registration
    ports: ["8081:8081"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/library
      SPRING_DATASOURCE_USERNAME: library
      SPRING_DATASOURCE_PASSWORD: library
      GENRES_SERVICE_URL: http://genres:8080
    depends_on:
      database: {condition: service_healthy}
      genres: {condition: service_started}
  reports:
    build: ./lab5/reports_registration
    ports: ["8082:8082"]
    environment:
      BOOKS_SERVICE_URL: http://books:8081
      GENRES_SERVICE_URL: http://genres:8080
    depends_on:
      books: {condition: service_started}
      genres: {condition: service_started}
volumes:
  postgres-data:
